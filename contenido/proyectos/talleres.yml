es:
  titulo: Talleres y masterclasses
  rotulo: Pedagogía · Festivales, escuelas y profesionales
  datos: Suelo · Partnering · Breaking · Teatro físico
  texto: |
    Talleres de danza urbana contemporánea a partir del lenguaje de la compañía: suelo, partnering, breaking y teatro físico.

    > Enseñamos desde el mismo lugar desde el que creamos.

    Para festivales, escuelas de danza y centros culturales. Los adaptamos al nivel del grupo y a la duración que necesites, de una sesión a un trimestre.
  ficha:
    - {dato: "Para", valor: "Festivales, escuelas, centros culturales y profesionales"}
    - {dato: "Duración", valor: "De 2 horas a un trimestre"}
    - {dato: "Idiomas", valor: "Castellano, català, English, français"}
    - {dato: "Hemos enseñado en", valor: "TNUA (Taipéi), James Carlès (Toulouse), Freiartfestival (Friburgo), Varium y Àrea (Barcelona)"}
  boton_video: Ver una clase
  pedir: ¿Quieres un taller para tu festival o escuela?

