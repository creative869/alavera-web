en:
  titulo: Workshops and masterclasses
  rotulo: Teaching · Festivals, schools and professionals
  datos: Floorwork · Partnering · Breaking · Physical theatre
  texto: |
    Contemporary urban dance workshops built on the company's language: floorwork, partnering, breaking and physical theatre.

    > We teach from the same place we create from.

    For festivals, dance schools and arts centres. We adapt them to the group's level and to the length you need, from a single session to a whole term.
  ficha:
    - {dato: "For", valor: "Festivals, schools, arts centres and professionals"}
    - {dato: "Length", valor: "From 2 hours to a full term"}
    - {dato: "Languages", valor: "Spanish, Catalan, English, French"}
    - {dato: "We have taught at", valor: "TNUA (Taipei), James Carlès (Toulouse), Freiartfestival (Freiburg), Varium and Àrea (Barcelona)"}
  boton_video: Watch a class
  pedir: Would you like a workshop for your festival or school?

fr:
  titulo: Ateliers et masterclasses
  rotulo: Pédagogie · Festivals, écoles et professionnels
  datos: Sol · Partnering · Breaking · Théâtre physique
  texto: |
    Des ateliers de danse urbaine contemporaine à partir du langage de la compagnie : travail au sol, partnering, breaking et théâtre physique.

    > Nous enseignons depuis le même endroit d'où nous créons.

    Pour festivals, écoles de danse et lieux culturels. Nous les adaptons au niveau du groupe et à la durée souhaitée, d'une séance à un trimestre.
  ficha:
