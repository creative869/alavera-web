  pedir: Would you like to bring it to your school?

fr:
  titulo: Happy Everything au collège et au lycée
  rotulo: Pédagogie · Collèges et lycées
  datos: Représentation et échange · 50–55 min
  texto: |
    Représentation du solo *Happy Everything* suivie d'un échange sur la santé mentale animé par une psychologue spécialisée.

    > Un espace où les élèves peuvent parler de la pression d'aller bien, de l'exigence envers soi-même et de la vulnérabilité.
