en:
  titulo: Happy Everything in schools
  rotulo: Teaching · Secondary schools
  datos: Performance and talk · 50–55 min
  texto: |
    A performance of the solo *Happy Everything* followed by a talk on mental health led by a specialised psychologist.

    > A space for students to talk about the pressure to be okay, self-demand and vulnerability.
  ficha:
    - {dato: "For", valor: "Secondary schools (ages 12–18)"}
