es:
  titulo: A medio camino
  rotulo: En gira · 2025
  datos: Trío · 23 min · Flamenco, krump y breaking · Calle y sala
  texto: |
    Tres cuerpos en escena que con cada gesto traen memoria y una voz que las une, las atraviesa, las sostiene.

    > Del «yo» al «nosotras». Del conflicto al juego, del ritmo individual al pulso compartido.

    *A medio camino* propone el encuentro del flamenco y la danza urbana contemporánea, haciendo dialogar la tradición flamenca con el krump y el breaking.

    Lenguajes cargados de historia, de luchas, de identidades que buscan ser escuchadas y nombradas. Cuerpos que hablan, que gritan y que se encuentran en un espacio común.
