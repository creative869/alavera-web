en:
  titulo: A medio camino
  rotulo: On tour · 2025
  datos: Trio · 23 min · Flamenco, krump and breaking · Street and stage
  texto: |
    Three bodies on stage, each gesture carrying memory, and one voice that binds them, runs through them and holds them.

    > From “I” to “we”. From conflict to play, from individual rhythm to a shared pulse.

    *A medio camino* (Halfway) brings flamenco and contemporary urban dance together, setting the flamenco tradition in dialogue with krump and breaking.

    Languages charged with history, with struggle, with identities that ask to be heard and named. Bodies that speak, shout and meet in a common space.
