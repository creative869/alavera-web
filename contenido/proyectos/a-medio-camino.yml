fr:
  titulo: A medio camino
  rotulo: En tournée · 2025
  datos: Trio · 23 min · Flamenco, krump et breaking · Rue et salle
  texto: |
    Trois corps sur scène qui, à chaque geste, portent une mémoire, et une voix qui les unit, les traverse et les soutient.

    > Du « je » au « nous ». Du conflit au jeu, du rythme individuel au pouls partagé.

    *A medio camino* (À mi-chemin) fait se rencontrer le flamenco et la danse urbaine contemporaine, en faisant dialoguer la tradition flamenca avec le krump et le breaking.

    Des langages chargés d'histoire, de luttes, d'identités qui cherchent à être écoutées et nommées. Des corps qui parlent, qui crient et qui se retrouvent dans un espace commun.
