en:
  titulo: Happy Everything
  rotulo: On tour · 2020
  datos: Solo · 15 min · Urban dance, contemporary dance and physical theatre
  texto: |
    *Happy Everything* looks at today's idea of happiness: its constant celebration, its commodification and the industry built around it. A state presented as compulsory, visible and permanent, driven by marketing, festivities and the story of a “perfect” life.

    Through a hybrid physicality that mixes urban dance, contemporary dance and physical theatre, the piece explores the friction that appears when happiness stops being an intimate experience and becomes a social expectation.

    > What happens when being okay becomes an obligation? What room is left for vulnerability, doubt or distress?

    Far from genuine happiness, *Happy Everything* exposes the exhaustion, pressure and emptiness this constant demand produces, and questions how these ready-made images shape our mental health and the way we live our everyday lives.
