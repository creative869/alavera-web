ca:
  titulo: Happy Everything
  rotulo: En gira · 2020
  datos: Solo · 15 min · Danses urbanes, dansa contemporània i teatre físic
  texto: |
    *Happy Everything* investiga el concepte contemporani de la felicitat: la seva celebració constant, la seva mercantilització i la indústria que l'envolta. Un estat presentat com a obligatori, visible i permanent, impulsat pel màrqueting, les festivitats i els relats d'una vida «perfecta».

    A través d'una fisicalitat híbrida entre danses urbanes, dansa contemporània i teatre físic, la peça explora la fricció que sorgeix quan la felicitat deixa de ser una experiència íntima per convertir-se en una expectativa social.

    > Què passa quan estar bé esdevé una imposició? Quin espai queda per a la vulnerabilitat, el dubte o el malestar?

    Lluny d'una felicitat autèntica, *Happy Everything* revela el desgast, la pressió i el buit que produeix aquest mandat constant, i qüestiona com aquestes imatges prefabricades influeixen en la nostra salut mental i en la manera com habitem el dia a dia.
