es:
  titulo: Happy Everything
  rotulo: En gira · 2020
  datos: Solo · 15 min · Danzas urbanas, danza contemporánea y teatro físico
  texto: |
    *Happy Everything* investiga el concepto contemporáneo de la felicidad: su celebración constante, su mercantilización y la industria que la envuelve. Un estado presentado como obligatorio, visible y permanente, impulsado por el marketing, las festividades y las narrativas de una vida «perfecta».

    A través de una fisicalidad híbrida entre danzas urbanas, danza contemporánea y teatro físico, la pieza explora la fricción que surge cuando la felicidad deja de ser una experiencia íntima para convertirse en una expectativa social.

    > ¿Qué ocurre cuando estar bien se vuelve una imposición? ¿Qué espacio queda para la vulnerabilidad, la duda o el malestar?

    Lejos de una felicidad auténtica, *Happy Everything* revela el desgaste, la presión y el vacío que produce este mandato constante, cuestionando cómo estas imágenes prefabricadas influyen en nuestra salud mental y en la manera en que habitamos nuestro día a día.
