fr:
  titulo: Happy Everything
  rotulo: En tournée · 2020
  datos: Solo · 15 min · Danses urbaines, danse contemporaine et théâtre physique
  texto: |
    *Happy Everything* interroge la notion contemporaine du bonheur : sa célébration permanente, sa marchandisation et l'industrie qui l'entoure. Un état présenté comme obligatoire, visible et permanent, porté par le marketing, les fêtes et le récit d'une vie « parfaite ».

    À travers une physicalité hybride entre danses urbaines, danse contemporaine et théâtre physique, la pièce explore la friction qui naît lorsque le bonheur cesse d'être une expérience intime pour devenir une attente sociale.

    > Que se passe-t-il quand aller bien devient une injonction ? Quelle place reste-t-il pour la vulnérabilité, le doute ou le mal-être ?

    Loin d'un bonheur authentique, *Happy Everything* révèle l'usure, la pression et le vide que produit cette injonction permanente, et questionne la manière dont ces images préfabriquées influencent notre santé mentale et notre façon d'habiter le quotidien.
