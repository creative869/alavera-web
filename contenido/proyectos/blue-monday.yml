es:
  titulo: Blue Monday
  rotulo: En gira · 2019
  datos: Dúo · 13 min · Calle y sala
  texto: |
    *Blue Monday* nos habla sobre las relaciones humanas, la necesidad y la dependencia del ser humano hacia ellas; y sobre la urgencia de sostener a los demás sin apenas sostenernos a nosotros mismos.

    > Intimidad, simbiosis, dependencia y transformación son algunas de las palabras que definen *Blue Monday*.

    Esta pieza, tercera creación del dúo Agnès Sales y Héctor Plaza, fue desarrollada durante el proyecto laboratorio «Back to the Lab» impulsado por el festival Breakin' Convention en el teatro Sadler's Wells de Londres.
  ficha:
