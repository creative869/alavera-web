en:
  titulo: Blue Monday
  rotulo: On tour · 2019
  datos: Duet · 13 min · Street and stage
  texto: |
    *Blue Monday* is about human relationships, our need for them and our dependence on them, and about the urgency of holding others up when we can barely hold ourselves.

    > Intimacy, symbiosis, dependence and transformation are some of the words that define *Blue Monday*.

    The third creation by the duo Agnès Sales and Héctor Plaza, the piece was developed during “Back to the Lab”, the laboratory run by Breakin' Convention at Sadler's Wells, London.
