  pedir: Would you like to programme *Blue Monday*?

fr:
  titulo: Blue Monday
  rotulo: En tournée · 2019
  datos: Duo · 13 min · Rue et salle
  texto: |
    *Blue Monday* parle des relations humaines, du besoin que nous en avons et de la dépendance qu'elles créent ; et de l'urgence de soutenir les autres alors que nous parvenons à peine à nous soutenir nous-mêmes.

    > Intimité, symbiose, dépendance et transformation sont quelques-uns des mots qui définissent *Blue Monday*.

    Troisième création du duo Agnès Sales et Héctor Plaza, la pièce a été développée lors du laboratoire « Back to the Lab » du festival Breakin' Convention, au théâtre Sadler's Wells de Londres.
